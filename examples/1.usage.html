<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>html-diagram usage</title>
    <link rel="stylesheet" href="../styles/default.css" />
    <style>
      html,
      body {
        margin: 0;
      }

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        font-family: sans-serif;
        color: #172033;
      }

      header,
      main,
      footer {
        width: min(100% - 48px, 960px);
        margin-inline: auto;
      }

      header {
        padding-block: 40px 24px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 32px;
      }

      header p {
        margin: 0;
        color: #526078;
      }

      main {
        flex: 1;
      }

      footer {
        padding-block: 24px 40px;
        font-size: 14px;
      }

      footer a {
        color: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <script type="module" src="../index.ts"></script>

    <header>
      <h1>html-diagram usage</h1>
      <p>Create a diagram with familiar HTML elements and a small set of diagram attributes.</p>
    </header>

    <main>
      <html-diagram title="Christmas decision tree" grid="20" padding="2">
        <d-node id="christmas" type="service" dx="10" dy="0">Christmas</d-node>
        <d-node id="shopping" type="service" dx="10" dy="6">Go shopping</d-node>
        <d-node id="think" type="database" dx="10" dy="12">Let me think</d-node>
        <d-node id="laptop" dx="0" dy="20">Laptop</d-node>
        <d-node id="iphone" dx="10" dy="20">iPhone</d-node>
        <d-node id="car" dx="20" dy="20">Car</d-node>

        <d-edge from="christmas" to="shopping" label="Get money"></d-edge>
        <d-edge from="shopping" to="think"></d-edge>
        <d-edge from="think" to="laptop" label="One" line="curved"></d-edge>
        <d-edge from="think" to="iphone" label="Two"></d-edge>
        <d-edge from="think" to="car" label="Three" line="curved"></d-edge>
      </html-diagram>
    </main>

    <footer>
      <a href="https://github.com/andyvanee/html-diagram">View html-diagram on GitHub</a>
    </footer>
  </body>
</html>
